<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#315b7d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MERI Schedule" />
  <title>MERI Schedule Assistant</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>MERI Schedule Assistant</h1>
      <p>업무 일정 · 준비사항 관리</p>
    </div>
    <button id="settingsButton" class="text-button">설정</button>
  </header>

  <main id="app">
    <section id="setupCard" class="card setup-card hidden">
      <h2>웹앱 연결 설정</h2>
      <p>Firebase Web 설정을 먼저 입력해야 일정을 불러올 수 있습니다.</p>
      <p class="muted">web/firebase-config.js 파일을 생성한 뒤 다시 열어주세요.</p>
    </section>

    <section id="summary" class="card summary hidden">
      <div><span>오늘 일정</span><strong id="todayCount">0건</strong></div>
      <div><span>예정 일정</span><strong id="upcomingCount">0건</strong></div>
      <small id="syncStatus">Outlook 연동</small>
    </section>

    <div id="pullHint" class="pull-hint">아래로 당겨 새로고침</div>
    <section id="eventList" class="event-list"></section>
    <section id="emptyState" class="empty hidden">등록된 업무 일정이 없습니다.</section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <h2>설정</h2>
      <label>내 일정 식별문자
        <input id="markerInput" maxlength="20" placeholder="예: 종" />
      </label>
      <p class="muted">일정 제목 마지막 [참석자코드]에서 찾습니다.</p>

      <hr />
      <h3>업무 유형별 기본 체크리스트</h3>
      <label>업무 유형
        <select id="typeSelect"></select>
      </label>
      <label>준비항목
        <textarea id="typeItemsInput" rows="6" placeholder="한 줄에 하나씩 입력"></textarea>
      </label>
      <p class="muted">한 줄에 하나씩 입력합니다. 이 기기의 Safari/브라우저에 저장됩니다.</p>
      <div class="inline-actions">
        <button id="resetTypeItemsButton" type="button" class="text-button">기본값 복원</button>
        <button id="saveTypeItemsButton" type="button">체크리스트 저장</button>
      </div>

      <div class="dialog-actions">
        <button value="cancel" class="text-button">닫기</button>
        <button id="saveSettingsButton" value="default">식별문자 저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailDialog">
    <form method="dialog" class="dialog-card detail-card">
      <button class="text-button back-button" value="cancel">← 일정</button>
      <h2 id="detailTitle"></h2>
      <p id="detailMeta" class="muted"></p>
      <h3>준비 체크리스트</h3>
      <div id="checklist"></div>
      <div class="dialog-actions">
        <button value="cancel">완료</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
